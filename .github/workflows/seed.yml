name: Seed Ayahs

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnostic - check files and secrets
        run: |
          echo "== Repo root =="
          ls -la
          echo ""
          echo "== scripts folder =="
          ls -la scripts || echo "MISSING: scripts folder"
          echo ""
          echo "== scripts/package.json content =="
          test -f scripts/package.json && cat scripts/package.json || echo "MISSING: scripts/package.json"
          echo ""
          echo "== Secrets check (values hidden) =="
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then echo "SUPABASE_URL: SET"; else echo "SUPABASE_URL: EMPTY"; fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then echo "SUPABASE_SERVICE_ROLE_KEY: SET"; else echo "SUPABASE_SERVICE_ROLE_KEY: EMPTY"; fi

      - name: Install dependencies (quran-meta)
        working-directory: scripts
        run: npm install

      - name: Run seed script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: node scripts/seed-data.js
